* { box-sizing: border-box; }

.hero .wrap { padding-block: 28px 64px; }

h1 { font: 500 clamp(38px, 9vw, 52px)/1 var(--f-display); margin: 10px 0 8px; text-wrap: balance; }
.lead { font-weight: 700; margin: 0; max-width: 34ch; }
main.wrap { margin-top: -44px; padding-block: 0 48px; display: flex; flex-direction: column; gap: 16px; }
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 20px; }
h2 { font: 500 30px/1.1 var(--f-display); color: var(--ocean); margin: 0 0 4px; text-wrap: balance; }
h3 { font: 500 22px/1.15 var(--f-display); color: var(--ocean); margin: 0; }
.sub { color: var(--muted); margin: 0 0 18px; }
.eyebrow { font: 800 12px/1 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.progress { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.bar { flex: 1; height: 6px; background: var(--ice); border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--aqua); border-radius: 99px; transition: width .3s; }
.fields { display: grid; gap: 14px; }
.field label, .lbl { display: block; font-weight: 800; font-size: 15px; color: var(--deep); margin-bottom: 6px; }
.field .hint { font-size: 14px; color: var(--muted); margin-top: 4px; }
.money { position: relative; }
.money span { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 700; pointer-events: none; }
.money .per { left: auto; right: 14px; font-weight: 400; font-size: 14px; }
input[type=text], input[type=email], input[type=tel], select, textarea {
  width: 100%; font: 400 17px/1.3 var(--f-body); color: var(--ink); background: var(--card);

.money input { padding-left: 28px; padding-right: 74px; font-variant-numeric: tabular-nums; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--aqua); }
:focus-visible { outline: 3px solid var(--orange); outline-offset: 2px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pills { display: flex; flex-wrap: wrap; gap: 8px; }

.nav { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 22px; flex-wrap: wrap; }
.btn { font: 500 22px/1 var(--f-display); letter-spacing: .01em; border: 0; border-radius: 999px; padding: 13px 26px; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-cta { background: var(--coral); color: var(--charcoal); box-shadow: 3px 3px 2px #000; }
.btn-cta:hover { background: var(--salmon); }

.btn-soft { background: var(--ice); color: var(--deep); }
.btn-soft:hover { background: var(--line); }
.link { background: none; border: 0; color: var(--teal); font: 800 15px var(--f-body); cursor: pointer; padding: 6px 2px; text-decoration: underline; text-underline-offset: 3px; }
.btn[disabled] { opacity: .5; cursor: default; }
/* start */
.choices { display: grid; gap: 12px; }
.choice { text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 18px; cursor: pointer; color: var(--ink); font: inherit; display: grid; gap: 2px; }

.choice b { font: 500 24px/1.1 var(--f-display); color: var(--ocean); }

.sample p { margin: 0; color: var(--muted); font-size: 15px; }

.drop.over { background: var(--card); }
.paste { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }

.pastebox:empty::before { content: 'Paste your screenshot here'; color: var(--muted); }

.drop b { font: 500 22px var(--f-display); color: var(--deep); }

.note { border-radius: 12px; padding: 10px 14px; font-size: 15px; }

.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin: 4px 0; }

.stub .sec:first-child { margin-top: 0; }
.row { display: flex; justify-content: space-between; gap: 12px; padding: 4px 0; }
.row span:first-child { color: var(--muted); min-width: 0; }
.row.total { font-weight: 800; border-top: 1.5px solid var(--ink); margin-top: 4px; padding-top: 8px; }
.row.total span:first-child { color: var(--ink); }
.neg { color: var(--no); }

.kpi { background: var(--ice); border-radius: 14px; padding: 12px 14px; }
.kpi b { display: block; font: 600 28px/1.1 var(--f-display); color: var(--deep); font-variant-numeric: tabular-nums; }
.kpi span { font-size: 14px; color: var(--muted); }
.tips { margin: 10px 0 0; padding-left: 20px; display: grid; gap: 6px; }
details summary { cursor: pointer; font-weight: 800; color: var(--teal); }
.targets { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 15px; }
.targets th, .targets td { text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); }
.targets th:first-child, .targets td:first-child { text-align: left; }
.targets th { font: 800 12px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.talk { border: 2px solid var(--aqua); }
.talk .script { font: 400 34px/1 var(--f-script); color: var(--teal); }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; color: var(--muted); }
.chk input { margin-top: 3px; width: 18px; height: 18px; accent-color: var(--ocean); }
.hp { position: absolute; left: -9999px; }
.foot { text-align: center; color: var(--muted); font-size: 13px; padding: 8px 0 0; }
.copybox { font-size: 14px; white-space: pre-wrap; background: var(--ice); border-radius: 12px; padding: 12px; max-height: 260px; overflow: auto; }
@media (max-width: 420px) { .two, .kpis { grid-template-columns: 1fr; } .verdict .word { font-size: 54px; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media print { .hero, .actions, .talk, .nav, #restart { display: none !important; } body { background: #fff; } .card, .verdict { box-shadow: none; border: 1px solid #ccc; } }

function bracketTax(income, brackets) {

function stateTax(code, annualWage, status, fedAnnual) {

  if (!st || st.none) return 0;

  var inc = annualWage;
  if (st.fedDeduct) inc -= Math.min(fedAnnual, st.fedDeduct);
  var sd = st.sd ? st.sd[k] : 0;
  if (st.wiPhase) {

  var bonus = Math.max(0, p.extra || 0);

function bindReader() {

  // directly where the browser allows it), or long-press > Paste in the box the button reveals.
  var fromPaste = function (e) {
    var cd = e.clipboardData, files = (cd && cd.files) || [], f = files[0];
    if (!f && cd && cd.items) for (var i = 0; i < cd.items.length; i++) if (/^image\//.test(cd.items[i].type)) { f = cd.items[i].getAsFile(); break; }
    if (f && /^image\//.test(f.type)) { e.preventDefault(); readShot(f); return true; }

var READ_PROMPT = 'This image is a travel healthcare (travel nurse) pay package or job offer. Read it and reply with ONLY a JSON object with these keys. Use null for anything not shown. Numbers only, no $ signs.\n' +
  '{"taxable_hourly": number (the rate for regular hours, not the overtime or blended rate), "hours_per_week": number, "weekly_meals": number (weekly meals and incidentals stipend, tax-free), "weekly_housing": number (weekly housing stipend, tax-free), "weekly_stipends": number (all tax-free weekly stipends added together, whatever the agency calls them: housing, lodging, M&IE, per diem, meals; convert daily or monthly amounts to weekly), "weekly_gross": number (total weekly pay including stipends), "contract_weeks": number, "travel_pay": number (total tax-free travel stipend or reimbursement for the contract, add first and last check together), "bonus": number (total taxable sign-on, completion or extension bonuses), "state": "two-letter US state code of the assignment", "city": string (city of the facility), "zip": "5-digit ZIP of the facility if shown", "start_date": "YYYY-MM-DD", "specialty": string, "notes": string (one short sentence about anything unusual, like a blended rate only)}';

function shrink(file) {
  return new Promise(function (resolve) {
    var img = new Image(), url = URL.createObjectURL(file);
    img.onload = function () {
      var max = 1600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * s); c.height = Math.round(h * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      c.toBlob(function (b) { resolve(b || file); }, 'image/jpeg', 0.88);
    };
    img.onerror = function () { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
function toBase64(blob) { return new Promise(function (r) { var fr = new FileReader(); fr.onload = function () { r(String(fr.result).split(',')[1]); }; fr.readAsDataURL(blob); }); }

async function readShot(file) {
  if (!/^image\//.test(file.type)) { note('err', 'That file isn\'t an image. Try a PNG or JPG screenshot.'); return; }
  note('ok', 'Reading your offer. This takes a few seconds...');
  try {
    var blob = await shrink(file), data = null;
    if (IN_CLAUDE) {
      var sample = await window.claude.use('sample');
      if (!sample) throw { code: 'unavailable' };
      data = await sample.json(READ_PROMPT, { images: [blob] });
    } else if (CONFIG.readerUrl) {
      var res = await fetch(CONFIG.readerUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ image: await toBase64(blob), mediaType: blob.type || 'image/jpeg' }) });
      if (!res.ok) throw { code: 'http' + res.status };
      data = await res.json();
    } else throw { code: 'unavailable' };
    applyOffer(data || {});
  } catch (e) {
    var c = e && e.code;
    note('err', c === 'not_granted' ? 'Screenshot reading is turned off here. Type the numbers below instead.'
      : c === 'rate_limited' || c === 'http429' ? 'Too many screenshots in a row. Wait a minute, or type the numbers below.'
      : 'I couldn\'t read that one. Try a clearer screenshot, or type the numbers below.');
  }
}
function applyOffer(d) {
  var o = S.cur, got = [];

  if (hrs) { o.hours = hrs; got.push('hours'); }

  else {

  }
  if (wks) { o.weeks = wks; got.push('contract length'); }

  var bon = n(d.bonus); if (bon) { o.bonus = bon; got.push('bonuses'); }

}

    ['Left over each week', function (x) { return signed(x.r.gain); }, 'gain'],
    ['Saved over the contract', function (x) { return signed(x.r.contractGain); }, 'gain'],
    ['Verdict', function (x) { return x.r.verdict.label; }, 'verdict'],
    ['Extra perks', function (x) { return x.o.perks || 'None listed'; }]
  ];
  return { cols: cols, best: best, rows: rows };
}
function compareHTML() {
  if (S.offers.length < 2) return '';
  var c = compareData(), color = { no: 'var(--no)', maybe: 'var(--maybe)', yes: 'var(--yes)', excellent: 'var(--exc)' };
  var head = '<tr><th></th>' + c.cols.map(function (x) {
    return '<th style="text-align:left;text-transform:none;letter-spacing:0;font-size:14px;color:var(--ink)' + (x === c.best ? ';background:var(--ice)' : '') + '">' + esc(x.o.label) +
      '<br><button class="link" style="font-size:13px" data-remove="' + x.idx + '" aria-label="Remove ' + esc(x.o.label) + '">Remove</button></th>';
  }).join('') + '</tr>';
  var body = c.rows.map(function (rw) {
    return '<tr><td style="color:var(--muted);font-size:14px">' + rw[0] + '</td>' + c.cols.map(function (x) {
      var v = esc(rw[1](x)), st = 'text-align:left' + (x === c.best ? ';background:var(--ice)' : '');
      if (rw[2] === 'gain') v = '<b' + (x.r.gain < 0 ? ' class="neg"' : '') + '>' + v + '</b>';
      if (rw[2] === 'verdict') v = '<span class="dot" style="background:' + color[x.r.verdict.key] + '"></span><b>' + v + '</b>';
      return '<td style="' + st + '">' + v + '</td>';
    }).join('') + '</tr>';
  }).join('');
  return '<section class="card"><h3>Side by side</h3><p class="sub" style="margin:4px 0 10px">Best for your budget: <b>' + esc(c.best.o.label) + '</b>, ' + signed(c.best.r.contractGain) + ' over the contract.</p>' +
    '<div class="scroll"><table class="targets compare">' + head + body + '</table></div></section>';
}

function offerHTML() {
  var o = S.offers[S.offers.length - 1];
  if (!o) { S.view = 'start'; return '<section class="card"><p>No offer yet.</p></section>'; }
  var a = answers(o), r = evaluate(a);
  return verdictHTML(r, o) +
    '<section class="card"><div class="kpis">' +
      '<div class="kpi"><b>' + money(r.takeHome - r.other) + '</b><span>Take-home from this job</span></div>' +
      '<div class="kpi"><b>' + money(r.breakEven) + '</b><span>Weekly break-even</span></div>' +
      '<div class="kpi"><b>' + money(a.rate * a.hours + a.stipends) + '</b><span>Estimated weekly total</span></div>' +
      '<div class="kpi"><b>' + signed(r.contractGain) + '</b><span>Saved over ' + r.weeks + ' weeks</span></div>' +
    '</div>' + (o.perks ? '<p style="margin:12px 0 0;font-size:15px"><b>Extra perks:</b> ' + esc(o.perks) + ' <span style="color:var(--muted)">(not counted in the numbers)</span></p>' : '') + '</section>' +
    compareHTML() + gapHTML(r, a) + stubHTML(r, a);
}

function workHTML(a, r, other, goal) {
  var row = function (l, v, cls) { return '<div class="row' + (cls ? ' ' + cls : '') + '"><span>' + l + '</span><span>' + v + '</span></div>'; };
  var homeMo = sum(a.home), assignMo = sum(a.assign);
  var h = '<section class="card"><h3>How I got this number</h3><div class="stub" style="margin-top:10px">' +
    row('Bills at home (' + money(homeMo) + ' a month)', money(r.home)) +
    row('Living on assignment (' + money(assignMo) + ' a month)', money(r.assign)) +
    row('Getting there (' + money(r.tripNet) + ' spread over ' + r.weeks + ' weeks)', money(r.trip)) +
    row('Your weekly costs', money(r.breakEven), 'total');
  if (other) h += row('Minus other household income', '-' + money(other)) + row('This job needs to bring home', money(Math.max(0, r.breakEven - other)), 'total');
  h += '</div><p class="hint" style="font-size:14px;color:var(--muted);margin:10px 0 0">Monthly amounts become weekly by multiplying by 12 and dividing by 52.' +
    (other ? ' If your other income isn\'t steady, plan on the full ' + money(r.breakEven) + ' a week.' : '') + '</p></section>';
  return h;
}

function exploreHTML() {
  var x = S.explore, a = answers(x), r = evaluate(a), other = r.other, goal = goalWk();
  var need = function (extra) { return Math.max(0, r.breakEven + extra - other); };
  var levels = [['Break even', 0, 'var(--maybe)'], ['Yes (+$250)', 250, 'var(--yes)'], ['Excellent (+$500)', 500, 'var(--exc)']];
  if (goal) levels.push(['Your goal (' + money(goalMo()) + '/mo)', goal, 'var(--orange)']);
  levels.sort(function (p, q) { return p[1] - q[1]; });
  var rows = levels.map(function (t) {
    var net = need(t[1]), mine = t[2] === 'var(--orange)';
    return '<tr' + (mine ? ' style="background:var(--ice)"' : '') + '><td><span class="dot" style="background:' + t[2] + '"></span>' + esc(t[0]) + '</td><td><b>' + money(net) + '</b></td><td><b>' + money(grossFor(net)) + '</b></td></tr>';
  }).join('');
  rows = '<tr><td><span class="dot" style="background:var(--no)"></span>No</td><td><b>&lt; ' + money(need(0)) + '</b></td><td><b>&lt; ' + money(grossFor(need(0))) + '</b></td></tr>' + rows;
  return '<section class="verdict yes"><span class="eyebrow" style="color:inherit">To break even this job needs</span>' +
      '<span class="big">' + money(need(0)) + '<small> / week take-home</small></span>' +
      '<p>This is what has to land in your account each week to break even on assignment in ' + esc(stateName(a.state)) + '.</p>' +
    '</section>' + workHTML(a, r, other, goal) +
    '<section class="card"><h3>Should you consider these rates?</h3>' +
      '<p class="sub" style="margin:4px 0 12px">Job posts usually show a weekly gross. Use this to tell at a glance if a job is worth asking about.</p>' +
      '<div class="scroll"><table class="targets"><thead><tr><th>Goal</th><th>Take-home (net)</th><th>Weekly gross (est.)</th></tr></thead><tbody>' + rows + '</tbody></table></div>' +
      '<p class="hint" style="font-size:14px;color:var(--muted);margin:10px 0 0">Anything under break even is a No: the contract would cost you money. Break even covers your weekly costs and nothing more. Each row below it adds what you\'d have left to save each week: ' + (goal ? money(goal) + ' for your goal (your ' + money(goalMo()) + ' a month), ' : '') + '$250 for a Yes and $500 for Excellent. ' + grossNote() + ' For a real answer, check an actual pay package.' + (other ? ' These numbers already count your other household income.' : '') + '</p>' +
    '</section>' +
    '<section class="card"><h3>Got an offer now?</h3><p class="sub" style="margin:4px 0 12px">Check it against your numbers. I\'ll keep everything you already entered.</p>' +
      '<button class="btn btn-cta" id="checkOffer">Check an Offer</button></section>';
}

function talkHTML() {
  var first = S.lead ? S.lead.first : '';
  if (S.talked) return '<section class="card talk"><span class="script">Got it!</span><p style="margin:6px 0 10px">Thanks' + (S.talked.first ? ', ' + esc(S.talked.first) : '') + '. I\'ll text you soon. Want to skip the wait? Grab a time on my calendar.</p>' +
    '<a class="btn btn-cta" href="' + CONFIG.bookingLink + '" target="_blank" rel="noopener">Pick a Time</a></section>';
  return '<section class="card talk" id="talk"><h3>' + (DESK ? 'Send this to ' + CONFIG.recruiter : 'Want a second set of eyes on this?') + '</h3>' +
    '<p class="sub" style="margin:6px 0 14px">' + (DESK
      ? 'I\'ll see your numbers and text you back about this one.'
      : 'I\'m ' + CONFIG.recruiter + ', a travel nurse recruiter who lived this life for 5 years. You don\'t need to be working with me. Send me your numbers and I\'ll tell you honestly what I\'d ask for, or help you find something that pays what you need.') + '</p>' +
    '<form id="talkForm" class="fields" novalidate>' +
      '<div class="two"><div class="field"><label for="t_first">First name</label><input type="text" id="t_first" autocomplete="given-name" value="' + esc(first) + '"></div>' +
      '<div class="field"><label for="t_phone">Cell phone</label><input type="tel" id="t_phone" autocomplete="tel" placeholder="(555) 555-5555"></div></div>' +
      '<div class="field"><label for="t_spec">Specialty</label><input type="text" id="t_spec" placeholder="e.g. ICU RN, Cath Lab Tech"></div>' +
      '<div class="field"><label for="t_note">Anything I should know? <span style="font-weight:400;color:var(--muted)">(optional)</span></label><textarea id="t_note" rows="2" placeholder="Where you want to go next, when you\'re free..."></textarea></div>' +
      '<label class="chk"><input type="checkbox" id="t_ok" checked> OK to text me about this. Message and data rates may apply. Reply STOP anytime.</label>' +
      '<div class="note err" id="talkErr" hidden></div>' +
      '<div><button class="btn btn-cta" type="submit">' + (DESK ? 'Send to ' + CONFIG.recruiter : 'Text Me About This') + '</button></div>' +
    '</form></section>';
}

function actionsHTML() {
  var top = window.top === window.self;
  return '<section class="card"><h3>Keep these numbers</h3><div class="actions" style="margin-top:12px">' +
    (S.mode !== 'explore' ? '<button class="btn btn-soft" id="another">Compare Another Offer</button>' : '') +
    '<button class="btn btn-soft" id="copy">Copy Results</button>' +
    (S.lead && !DESK ? '<button class="btn btn-soft" id="mail">Email Me This PDF</button>' : '<button class="btn btn-soft" id="dl">Save as PDF</button>') +
    (top && DESK ? '<button class="btn btn-soft" id="print">Print</button>' : '') +
    '<button class="btn btn-soft" id="edit">Change My Answers</button>' +
    '</div><div class="note ok" id="actNote" hidden style="margin-top:12px"></div>' +
    '<div style="margin-top:12px"><button class="link" id="restart">Start over with a new budget</button></div></section>';
}

function bindResult() {
  var q = function (id) { return document.getElementById(id); };
  var actNote = function (m) { var n = q('actNote'); n.textContent = m; n.hidden = false; };
  if (q('checkOffer')) q('checkOffer').onclick = function () {
    var from = S.explore; S.mode = 'offer'; S.cur = newOffer(from); S.flow = ['offer']; S.i = 0; S.view = 'step'; render(); window.scrollTo(0, 0);
  };
  if (q('another')) q('another').onclick = function () {
    S.cur = newOffer(S.offers[S.offers.length - 1]); S.cur.label = ''; S.cur.rate = ''; S.cur.meals = ''; S.cur.housing = ''; S.cur.travelPay = ''; S.cur.bonus = ''; S.cur.perks = '';
    S.flow = FLOWS.another.slice(); S.i = 0; S.view = 'step'; render(); window.scrollTo(0, 0);
  };
  app.querySelectorAll('[data-remove]').forEach(function (b) { b.onclick = function () { S.offers.splice(Number(b.dataset.remove), 1); render(); }; });
  q('edit').onclick = function () {
    var list = S.mode === 'explore' ? FLOWS.explore : FLOWS.offer;
    S.flow = list.filter(function (k) { return k !== 'gate'; }); S.i = 0;
    S.editIdx = S.mode === 'explore' ? null : S.offers.length - 1;
    S.cur = S.mode === 'explore' ? S.explore : S.offers[S.editIdx];
    S.view = 'step'; render(); window.scrollTo(0, 0);
  };
  q('restart').onclick = function () { var lead = S.lead; S = fresh(); S.lead = lead; render(); window.scrollTo(0, 0); };
  q('copy').onclick = function () {
    var text = 'My assignment numbers (No Ordinary Path pay calculator)\n' + summary();
    var done = function () { actNote('Copied. Paste it into a text or a note.'); };
    try { navigator.clipboard.writeText(text).then(done, function () { showText(text); }); } catch (e) { showText(text); }
  };
  if (q('mail')) q('mail').onclick = function () {
    var btn = this; btn.disabled = true;
    if (!CONFIG.leadUrl) { actNote('Email isn\'t set up yet.'); btn.disabled = false; return; }
    sendLead(Object.assign({ kind: 'results', repeat: true, first: S.lead.first, email: S.lead.email, mode: S.mode, summary: summary() }, headline(), pdfPayload()))
      .then(function () { actNote('Sent to ' + S.lead.email + '. It should land in a minute or two. Check spam if you don\'t see it.'); setTimeout(function () { btn.disabled = false; }, 4000); });
  };
  if (q('dl')) q('dl').onclick = async function () {
    var btn = this; btn.disabled = true;
    try { actNote(await savePDF()); }
    catch (e) { if (!(e && e.code === 'cancelled')) actNote('I couldn\'t make the PDF here. Use Copy Results instead.'); }
    finally { btn.disabled = false; }
  };
  if (q('print')) q('print').onclick = function () { window.print(); };
  if (q('talkForm')) q('talkForm').onsubmit = function (e) {
    e.preventDefault();
    var first = q('t_first').value.trim(), phone = q('t_phone').value.trim(), digits = phone.replace(/\D/g, ''), err = q('talkErr');
    if (!first) { err.textContent = 'Add your first name.'; err.hidden = false; return; }
    if (digits.length < 10) { err.textContent = 'Add a 10-digit cell number so I can text you.'; err.hidden = false; return; }
    if (!q('t_ok').checked) { err.textContent = 'Check the box so I\'m allowed to text you.'; err.hidden = false; return; }
    S.talked = { first: first };
    sendLead(Object.assign({ kind: 'talk', first: first, phone: phone, email: S.lead ? S.lead.email : '', specialty: q('t_spec').value.trim(), note: q('t_note').value.trim(), mode: S.mode, summary: summary() }, headline()));
    render(); var t = document.querySelector('.talk'); if (t) t.scrollIntoView({ block: 'center' });
  };
  function showText(text) { var n = q('actNote'); n.innerHTML = 'Select and copy this:<div class="copybox"></div>'; n.querySelector('.copybox').textContent = text; n.hidden = false; }
}

render();
</script>
